# Local development only: the frontend, the backend and a mock PostgreSQL
# seeded with synthetic data, so the whole app can be tried end to end before
# deploying to Northflank. Not for production use.
#
#   cp .env.example .env      # optional: set passwords or an LLM key
#   docker compose up --build
#
# Web app: http://localhost:8080   API: http://localhost:8000/docs
# Postgres (for backend tests): localhost:5433

name: cohort-studio

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: cohort
      POSTGRES_USER: cohort_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-owner-password}
      APP_DB_USER: cohort_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/db/schema.sql:/cohort-db/schema.sql:ro
      - ./backend/db/roles.sql:/cohort-db/roles.sql:ro
      - ./backend/db/docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohort_owner -d cohort"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Loads synthetic data once (skips if the tables already have rows), as the
  # database owner. The backend itself only ever connects as cohort_app.
  seed:
    build: ./backend
    command: ["python", "-m", "app.seed", "--if-empty"]
    environment:
      SEED_DATABASE_URL: postgresql://cohort_owner:${POSTGRES_PASSWORD:-local-owner-password}@postgres:5432/cohort
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      PORT: "8000"
      LOG_FORMAT: text
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: cohort
      DB_USER: cohort_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-password}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      PORT: "8080"
      # The browser calls the API directly, so this is the URL as seen from the host.
      API_BASE_URL: http://localhost:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
