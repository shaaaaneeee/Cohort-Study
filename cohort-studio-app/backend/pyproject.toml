[project]
name = "cohort-studio-backend"
version = "1.0.0"
description = "Cohort Studio MCP server: study tools for AI agents, run on a Databricks SQL warehouse."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Exact pins. Each was checked with `pip index versions <pkg>` on 2026-10-27.
dependencies = [
    "fastapi==0.162.0",
    "lifelines==0.30.3",
    "numpy==2.5.4",
    "pandas==2.3.3",           # newest 2.x: lifelines 0.30.3 requires pandas<3
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyYAML==6.0.3",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "uvicorn==0.54.0",
    "mcp==2.3.0",
    "databricks-sql-connector[pyarrow]==4.9.0",  # Databricks SQL warehouse
    "databricks-sdk==0.167.0",           # Databricks auth (inside a Databricks App)
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
    "ruff==0.17.2",
    "scipy-stubs==1.18.1.1",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["openapi.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "S", "C4", "PT", "LOG", "G"]
ignore = [
    "S101",    # asserts state invariants for the type checker
    "S608",    # the SQL builder writes only names checked against the mapping; values are bound
    "RUF001",  # the explanatory text uses typographic characters on purpose
    "RUF002",
    "RUF003",
    "N806",    # X for a design matrix is the statistical convention
    "N803",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "lifelines.*"]
ignore_missing_imports = true
