# Runs the MCP server as a Databricks App, serving the study tools to Genie
# One, Genie Code and the AI Playground at /mcp. Steps: docs/databricks-app.md.
#
# Databricks installs the packages in requirements.txt with pip (Python 3.11).
command: ["python", "-m", "app"]

env:
  # The SQL warehouse added to the app as a resource with the key "sql-warehouse".
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Genie Code calls /mcp from the workspace page in the browser, so the
  # workspace's address must be an allowed origin. Change it for another workspace.
  # HEALIX: replace with the Healix workspace URL (https://..., no trailing slash).
  - name: CORS_ORIGINS
    value: https://dbc-0bb9dc69-9647.cloud.databricks.com
  - name: LOG_FORMAT
    value: text
